kind = "mobile"
previewPath = "/"
title = "نبيه – AI English Teacher"
version = "1.0.0"
id = "artifacts/nabih-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19331

[services.development]
run = "pnpm --filter @workspace/nabih-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nabih-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nabih-app", "run", "serve" ]

[services.env]
PORT = "19331"
BASE_PATH = "/"
